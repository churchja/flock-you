# CardputerZero Radio - station list
#
# This file is copied to ~/.config/cardputerzero-radio/stations.toml on first
# run and is never rewritten by the app, so your edits and comments survive
# upgrades.  Stations you save from the in-app search land in saved.json
# instead.
#
# Each entry needs a name and url; everything else is cosmetic.
#
#   [[station]]
#   name    = "My Station"
#   url     = "https://example.com/stream.mp3"
#   genre   = "talk"
#   country = "US"
#   codec   = "MP3"        # picks the recording file extension
#   bitrate = 128

